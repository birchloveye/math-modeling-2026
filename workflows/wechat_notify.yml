name: 企业微信 Push 提醒

on:
  push:
    branches:
      - main
      - master

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 发送企业微信通知
        run: |
          curl '${{ secrets.WECHAT_WORK_WEBHOOK }}' \
            -H 'Content-Type: application/json' \
            -d '{
              "msgtype": "markdown",
              "markdown": {
                "content": "### 🚀 Git 新提交提醒\n> **项目**: `${{ github.repository }}`\n> **提交人**: `${{ github.actor }}`\n> **分支**: `${{ github.ref_name }}`\n> **Commit 信息**: \n> `${{ github.event.head_commit.message }}`\n\n[点击查看变更](${{ github.event.head_commit.url }})"
              }
            }'
